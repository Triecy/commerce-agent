[project]
name = "commerce-agent"
version = "0.0.1"
description = "Evented multi-agent recommendation and shopping-assistant platform (portfolio project)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "numpy>=2.5.5",
    "pydantic-settings>=2.16.3",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "managed"

# torch on Linux comes from the CPU-only index (no CUDA wheels in CI or on servers).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# N802: test names carry requirement IDs, e.g. test_FR_I2_no_oversell (CLAUDE.md §1).
# S311: seeded pseudo-random fixtures are fine in tests.
"tests/**" = ["S101", "N802", "S311"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["commerce_agent"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

# SPEC/CLAUDE.md: mypy strict for common/.
[[tool.mypy.overrides]]
module = ["commerce_agent.common", "commerce_agent.common.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette suggests a different HTTP client for TestClient; keep pinned httpx for now.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "integration: needs real containers (testcontainers); not run in unit CI",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "scipy-stubs>=1.18.1.1",
    "testcontainers>=4.15.0",
]
ml = [
    "sentence-transformers>=6.3.0",
    "torch>=2.11,<2.12",
]
