name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI is offline with respect to LLMs: no API key, no real LLM calls (CLAUDE.md §7.2).
      ANTHROPIC_API_KEY: ""
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install Python 3.12 and locked dependencies
        run: uv sync --locked

      - name: Ruff
        run: make lint

      - name: mypy
        run: make typecheck

      - name: Unit tests
        run: make test

  compose:
    name: validate compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: docker compose config
        run: docker compose -f deploy/compose.yml --env-file .env.example --profile core config --quiet
